# Стек ДЗ: Triton + vLLM + gateway + Prometheus + node-exporter.
# Обе модели (CV в Triton и LLM в vLLM) делят один GPU.
name: hw-realtime-inference

services:
  triton:
    # Triton 24.06 из зеркала NGC (nvcr.io из РФ отдаёт 403) — по digest официального образа.
    # Запасное зеркало: m.daocloud.io/nvcr.io/nvidia/tritonserver@sha256:<тот же digest>
    image: nvcr.nju.edu.cn/nvidia/tritonserver@sha256:153d3158d96346bc50df7fa6e1c3a96d6dc638249072be20ebbbcae07b8505ca
    # explicit + --load-model: в Triton грузится ТОЛЬКО модель варианта (имя = CV_MODEL),
    # метрики на :8002 вместе с GPU-метриками (nv_gpu_*).
    command: >
      tritonserver
      --model-repository=/models
      --model-control-mode=explicit
      --load-model=${CV_MODEL}
      --allow-metrics=true
      --allow-gpu-metrics=true
      --metrics-port=8002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./model_repository:/models
    ports:
      - "8002:8002"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  vllm:
    # Версия закреплена (эталон ДЗ проверен на v0.33.0), не latest.
    image: vllm/vllm-openai:v0.33.0
    # Имя модели для клиентов — LLM_MODEL (gateway шлёт model: "Qwen2.5-1.5B-Instruct").
    # GPU делится с Triton: ограничиваем долю памяти и контекст.
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --served-model-name ${LLM_MODEL}
      --gpu-memory-utilization 0.5
      --max-model-len 4096
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - CV_MODEL=${CV_MODEL}
      - LLM_MODEL=${LLM_MODEL}
      - TRITON_URL=triton:8000
      - TRITON_METRICS_URL=http://triton:8002/metrics
      - VLLM_URL=http://vllm:8000
      - VLLM_METRICS_URL=http://vllm:8000/metrics
      - NODE_METRICS_URL=http://node-exporter:9100/metrics
      - GPU_NAME=${GPU_NAME:-unknown}
      - STUDENT_NAME=${STUDENT_NAME}
      - STUDENT_EMAIL=${STUDENT_EMAIL}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - triton
      - vllm
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    ports:
      - "9100:9100"
    restart: unless-stopped

volumes:
  hf_cache:
  prometheus_data:
